  <script>
  (function(){
    var FORMULAS = [
      {name:"桂枝汤", source:"《伤寒论》", compose:"桂枝9g、芍药9g、生姜9g、大枣12枚、炙甘草6g", effect:"解肌发表，调和营卫", indic:"外感风寒表虚证。恶风发热、汗出、头痛、鼻鸣干呕、苔薄白、脉浮缓", key:"调和营卫第一方。有汗用桂枝，无汗用麻黄。", story:"张仲景《伤寒论》开篇第一方。桂枝辛温解肌，芍药酸寒敛营，一散一收，调和营卫。被誉为「群方之冠」，后世无数方从此化裁而来。"},
      {name:"麻黄汤", source:"《伤寒论》", compose:"麻黄9g、桂枝6g、杏仁9g、炙甘草3g", effect:"发汗解表，宣肺平喘", indic:"外感风寒表实证。恶寒发热、无汗、头身疼痛、喘、脉浮紧", key:"发汗解表第一方。无汗而喘用麻黄汤。", story:"仲景治伤寒表实无汗之主方。麻黄开腠发汗，桂枝助其解表，杏仁降肺气，甘草调和。与桂枝汤并称「麻桂」，一开一合，表证总纲。"},
      {name:"小柴胡汤", source:"《伤寒论》", compose:"柴胡24g、黄芩9g、人参9g、半夏9g、生姜9g、大枣12枚、炙甘草9g", effect:"和解少阳", indic:"少阳证。往来寒热、胸胁苦满、默默不欲饮食、心烦喜呕、口苦咽干目眩", key:"和解少阳代表方。", story:"少阳病主方。柴胡疏少阳之郁，黄芩清少阳之热，人参、大枣、甘草扶正，半夏、生姜和胃。后世「和解法」由此确立，被誉为「少阳枢机」之方。"},
      {name:"四君子汤", source:"《太平惠民和剂局方》", compose:"人参、白术、茯苓、炙甘草各等分", effect:"益气健脾", indic:"脾胃气虚证。面色萎白、语声低微、气短乏力、食少便溏、脉虚弱", key:"补气基础方。四君子 → 六君子 → 香砂六君子。", story:"人参、白术、茯苓、甘草四药，药性平和中正，如君子之德，故名「四君子」。后世补气方多从此加减，是脾胃气虚的基础方。"},
      {name:"四物汤", source:"《太平惠民和剂局方》", compose:"熟地黄、当归、白芍、川芎各等分", effect:"补血调血", indic:"营血虚滞证。头晕目眩、心悸失眠、面色无华、月经不调、痛经", key:"补血基础方。", story:"熟地补血、当归活血、白芍敛血、川芎行血，四药相合，补中有动，被誉为「血家百病此方通」。妇科调经多从此化裁。"},
      {name:"六味地黄丸", source:"《小儿药证直诀》", compose:"熟地黄24g、山萸肉12g、山药12g、泽泻9g、牡丹皮9g、茯苓9g", effect:"滋阴补肾", indic:"肾阴虚证。腰膝酸软、头晕耳鸣、盗汗、遗精、骨蒸潮热、舌红少苔", key:"三补三泻。补肾阴基础方。", story:"钱乙从《金匮》肾气丸化裁而来，去桂附，专补肾阴。熟地、山萸、山药为三补，泽泻、丹皮、茯苓为三泻，补中有泻，滋而不腻，成为后世补阴第一方。"},
      {name:"逍遥散", source:"《太平惠民和剂局方》", compose:"柴胡、当归、白芍、白术、茯苓、炙甘草、生姜、薄荷", effect:"疏肝解郁，养血健脾", indic:"肝郁血虚脾弱证。两胁作痛、神疲食少、月经不调、乳房胀痛", key:"疏肝代表方。", story:"「逍遥」取自《庄子》，意指心无挂碍、自由自在。肝郁则气滞，气滞则血虚脾弱，此方疏肝养血健脾，使肝气得舒、气血得畅，身心得以逍遥。"},
      {name:"补中益气汤", source:"《脾胃论》", compose:"黄芪、炙甘草、人参、当归、陈皮、升麻、柴胡、白术", effect:"补中益气，升阳举陷", indic:"脾胃气虚、气虚下陷证。少气懒言、体倦乏力、脱肛、子宫脱垂、久泻", key:"李东垣补中升阳代表方。", story:"李东垣创制。他认为「脾胃内伤，百病由生」，用黄芪大补中气，升麻、柴胡升举清阳，使下陷之气得升。后世治气虚下陷、内脏下垂多从此方。"},
      {name:"归脾汤", source:"《济生方》", compose:"白术、茯神、黄芪、龙眼肉、酸枣仁、人参、木香、炙甘草、当归、远志", effect:"益气补血，健脾养心", indic:"心脾两虚证。心悸怔忡、健忘失眠、体倦食少、面色萎黄、崩漏", key:"心脾同治。", story:"「归脾」意指使心血归于脾、脾气归于心，心脾两脏同补。思虑过度伤及心脾，此方益气生血、健脾养心，是心脾两虚失眠、健忘的经典方。"},
      {name:"生脉散", source:"《医学启源》", compose:"人参、麦冬、五味子", effect:"益气生津，敛阴止汗", indic:"气阴两伤证。体倦气短、咽干口渴、汗多、脉虚细", key:"气阴双补。", story:"人参大补元气，麦冬养阴生津，五味子酸敛止汗。三药合用，气阴双补，能使将绝之脉复生，故名「生脉」。暑热伤气阴或久咳肺虚时常用。"},
      {name:"银翘散", source:"《温病条辨》", compose:"金银花、连翘、桔梗、薄荷、竹叶、生甘草、荆芥穗、淡豆豉、牛蒡子", effect:"辛凉透表，清热解毒", indic:"温病初起。发热、微恶风寒、无汗或有汗不畅、头痛口渴、咳嗽咽痛", key:"辛凉解表代表方。", story:"吴鞠通创制。金银花、连翘清热解毒为君，配辛凉透表之品，专治温病初起。与桑菊饮并称温病解表两大主方，一偏解毒，一偏宣肺。"},
      {name:"白虎汤", source:"《伤寒论》", compose:"石膏、知母、甘草、粳米", effect:"清热生津", indic:"气分热盛证。壮热面赤、烦渴引饮、汗出恶热、脉洪大有力", key:"清热生津代表方。", story:"白虎为西方金神，主清肃。本方清热力量峻猛，如白虎之威，故名。石膏清热泻火，知母滋阴润燥，粳米、甘草护胃，是气分大热的经典方。"},
      {name:"龙胆泻肝汤", source:"《医方集解》", compose:"龙胆草、黄芩、栀子、泽泻、木通、车前子、当归、生地、柴胡、甘草", effect:"清泻肝胆实火，清利肝经湿热", indic:"肝胆实火或湿热。头痛目赤、胁痛口苦、耳聋耳肿、阴肿阴痒、带下黄臭", key:"肝经湿热/实火代表方。", story:"龙胆草大苦大寒，专泻肝胆实火，故以「龙胆」名方。配伍清利湿热、养血柔肝之品，使泻火而不伤阴，是肝经实火湿热的代表方。"},
      {name:"大承气汤", source:"《伤寒论》", compose:"大黄、厚朴、枳实、芒硝", effect:"峻下热结", indic:"阳明腑实证。痞、满、燥、实。潮热谵语、手足濈然汗出、腹痛拒按、脉沉实", key:"苦寒峻下。", story:"「承气」意为承顺胃气下行。大黄攻下，芒硝软坚，枳实、厚朴行气除满，四药合用，峻下热结，使燥屎得下、胃气得承。是攻下法的代表方。"},
      {name:"理中丸", source:"《伤寒论》", compose:"人参、干姜、白术、炙甘草", effect:"温中祛寒，补气健脾", indic:"脾胃虚寒证。脘腹疼痛、喜温喜按、呕吐便溏、畏寒肢冷、口不渴", key:"温中补虚基础方。", story:"「理中」即调理中焦脾胃。干姜温中祛寒，人参、白术、甘草补气健脾，使中焦阳气得复、运化得健。是脾胃虚寒的基础方，可丸可汤。"},
      {name:"四逆汤", source:"《伤寒论》", compose:"附子、干姜、炙甘草", effect:"回阳救逆", indic:"少阴病。四肢厥逆、恶寒蜷卧、神衰欲寐、面色苍白、脉微细", key:"回阳救逆第一方。", story:"「四逆」指四肢厥逆。附子大辛大热回阳，干姜温中助阳，甘草缓和药性。三药合用，能救将绝之阳，是回阳救逆的第一方，危急时救急要药。"},
      {name:"真武汤", source:"《伤寒论》", compose:"茯苓、芍药、白术、生姜、附子", effect:"温阳利水", indic:"阳虚水泛证。畏寒肢厥、小便不利、心下悸、头眩、身瞤动", key:"温阳利水代表方。", story:"真武为北方水神。本方温肾阳、利水湿，如真武之神力。附子温阳，茯苓、白术健脾利水，生姜散水，芍药缓急，是阳虚水泛的经典方。"},
      {name:"血府逐瘀汤", source:"《医林改错》", compose:"桃仁、红花、当归、生地、川芎、赤芍、牛膝、桔梗、柴胡、枳壳、甘草", effect:"活血化瘀，行气止痛", indic:"胸中血瘀证。胸痛、头痛日久不愈、痛如针刺、唇暗、舌有瘀斑", key:"活血化瘀代表方之一。", story:"王清任创制。认为胸中为血府，血瘀则诸症丛生。本方以桃红四物汤活血，配柴胡、枳壳、桔梗、牛膝行气，使气行血行，瘀去新生。"},
      {name:"逍遥丸", source:"《太平惠民和剂局方》", compose:"柴胡、当归、白芍、白术、茯苓、炙甘草、薄荷、生姜", effect:"疏肝解郁，健脾养血", indic:"肝郁脾虚证。胸胁胀痛、神疲食少、月经不调", key:"疏肝健脾常用方。", story:"与逍遥散同源，制成丸剂便于服用。疏肝解郁、健脾养血，使肝气条达、脾气健运，身心得以舒畅。"},
      {name:"六君子汤", source:"《医学正传》", compose:"人参、白术、茯苓、炙甘草、陈皮、半夏", effect:"益气健脾，燥湿化痰", indic:"脾胃气虚兼痰湿。食少便溏、胸脘痞闷、咳嗽痰多", key:"四君子加陈皮半夏。", story:"四君子汤加陈皮、半夏，既能补气健脾，又能燥湿化痰，适合气虚夹痰湿者。后世香砂六君子汤由此再加木香、砂仁。"},
      {name:"玉屏风散", source:"《究原方》", compose:"黄芪、白术、防风", effect:"益气固表止汗", indic:"表虚自汗、易感风邪。汗出恶风、面色㿠白、舌淡苔薄白、脉浮虚", key:"益气固表代表方。", story:"黄芪益气固表，白术健脾，防风走表祛风。三药合用，如御风之屏障，故名「玉屏风」。是气虚易感、自汗的常用方。"},
      {name:"小青龙汤", source:"《伤寒论》", compose:"麻黄、芍药、细辛、干姜、炙甘草、桂枝、五味子、半夏", effect:"解表散寒，温肺化饮", indic:"外寒内饮证。恶寒发热、无汗、喘咳、痰多而稀、不得平卧", key:"外寒内饮代表方。", story:"青龙为东方木神，主升发。本方发散风寒、温化水饮，如青龙升发之势。麻黄、桂枝解表，干姜、细辛、半夏温化寒饮，芍药、五味子敛肺，散中有收。"},
      {name:"半夏厚朴汤", source:"《金匮要略》", compose:"半夏、厚朴、茯苓、生姜、苏叶", effect:"行气散结，降逆化痰", indic:"梅核气。咽中如有物阻、咯之不出、咽之不下、胸胁满闷", key:"梅核气代表方。", story:"专治情志不畅、痰气互结之梅核气。半夏化痰散结，厚朴行气，茯苓渗湿，生姜、苏叶宣通，使气顺痰消，咽中梗阻自除。"},
      {name:"酸枣仁汤", source:"《金匮要略》", compose:"酸枣仁、甘草、知母、茯苓、川芎", effect:"养血安神，清热除烦", indic:"虚劳虚烦不得眠。心悸、盗汗、头目眩晕、咽干口燥", key:"养血安神代表方。", story:"酸枣仁养肝血、安心神为君，川芎调肝血，茯苓宁心，知母清热除烦，甘草和中。肝血得养、虚热得清，则睡眠自安。"},
      {name:"甘麦大枣汤", source:"《金匮要略》", compose:"甘草、小麦、大枣", effect:"养心安神，和中缓急", indic:"脏躁。精神恍惚、常悲伤欲哭、不能自主、心中烦乱、睡眠不安", key:"脏躁代表方。", story:"仲景治妇人脏躁之方。小麦养心气，甘草、大枣甘缓补中。药简力专，使心气得养、脏躁得安，后世治情志病多从此化裁。"},
      {name:"茵陈蒿汤", source:"《伤寒论》", compose:"茵陈蒿、栀子、大黄", effect:"清热利湿退黄", indic:"湿热黄疸。身目俱黄、黄色鲜明、发热、口渴、小便短赤、腹胀", key:"湿热黄疸代表方。", story:"茵陈蒿清利湿热、退黄疸为君，栀子清三焦湿热，大黄通腑泄热。三药合用，使湿热从二便而去，是阳黄的经典方。"},
      {name:"五苓散", source:"《伤寒论》", compose:"猪苓、泽泻、白术、茯苓、桂枝", effect:"利水渗湿，温阳化气", indic:"蓄水证、痰饮。小便不利、水肿、泄泻、脐下悸、吐涎沫", key:"利水化气代表方。", story:"猪苓、泽泻、茯苓利水，白术健脾，桂枝温阳化气。水湿得利、阳气得化，则小便通利、水肿得消。是利水剂中的代表方。"},
      {name:"平胃散", source:"《太平惠民和剂局方》", compose:"苍术、厚朴、陈皮、炙甘草", effect:"燥湿运脾，行气和胃", indic:"湿滞脾胃证。脘腹胀满、不思饮食、口淡无味、恶心呕吐、大便溏薄", key:"燥湿运脾代表方。", story:"苍术燥湿健脾，厚朴行气除满，陈皮理气和中，甘草调和。四药合用，使湿去脾运、气机得畅，是湿滞中焦的基础方。"},
      {name:"保和丸", source:"《丹溪心法》", compose:"山楂、神曲、半夏、茯苓、陈皮、连翘、莱菔子", effect:"消食和胃", indic:"食积证。脘腹痞满胀痛、嗳腐吞酸、恶食呕逆、大便失常", key:"消食导滞代表方。", story:"朱丹溪创制。山楂消肉食，神曲消酒食，莱菔子消面积，半夏、陈皮、茯苓和胃化湿，连翘散结清热。食积得消、胃气得和。"},
      {name:"二陈汤", source:"《太平惠民和剂局方》", compose:"半夏、陈皮、茯苓、炙甘草", effect:"燥湿化痰，理气和中", indic:"湿痰证。咳嗽痰多、色白易咯、胸膈痞闷、恶心呕吐、肢体困倦", key:"燥湿化痰基础方。", story:"半夏、陈皮以陈久者良，故名「二陈」。半夏燥湿化痰，陈皮理气，茯苓健脾渗湿，甘草和中。后世治痰方多从此加减。"},
      {name:"温胆汤", source:"《三因极一病证方论》", compose:"半夏、竹茹、枳实、陈皮、炙甘草、茯苓、生姜、大枣", effect:"理气化痰，清胆和胃", indic:"胆郁痰扰证。虚烦失眠、触事易惊、呕吐呃逆、癫痫", key:"清胆化痰代表方。", story:"胆为中正之官，痰热扰胆则虚烦不宁。本方理气化痰、清胆和胃，使胆气清宁、胃气和降，是痰热内扰、虚烦失眠的常用方。"},
      {name:"天王补心丹", source:"《校注妇人良方》", compose:"人参、茯苓、玄参、丹参、桔梗、远志、当归、五味子、麦冬、天冬、柏子仁、酸枣仁、生地", effect:"滋阴养血，补心安神", indic:"阴虚血少、神志不安。心悸失眠、虚烦神疲、梦遗、手足心热、口舌生疮", key:"滋阴补心代表方。", story:"心阴不足、心神失养则失眠心悸。本方重用生地滋阴，配养血安神、清虚热之品，使阴血得充、心神得安，是阴虚失眠的经典方。"},
      {name:"归脾丸", source:"《济生方》", compose:"白术、茯神、黄芪、龙眼肉、酸枣仁、人参、木香、炙甘草、当归、远志", effect:"益气补血，健脾养心", indic:"心脾两虚。心悸失眠、健忘体倦、食少、面色萎黄", key:"心脾两虚常用成药。", story:"与归脾汤同方，制成丸剂。益气生血、健脾养心，使气血得充、心神得养，是心脾两虚的常用成药。"},
      {name:"六味地黄丸（成药）", source:"《小儿药证直诀》", compose:"熟地黄、山茱萸、山药、泽泻、牡丹皮、茯苓", effect:"滋阴补肾", indic:"肾阴虚。腰膝酸软、头晕耳鸣、盗汗、遗精、消渴", key:"补肾阴最常用成药。", story:"三补三泻，滋补肾阴而不腻。是肾阴虚的基础成药，后世知柏地黄丸、杞菊地黄丸等皆从此加减。"},
      {name:"金匮肾气丸", source:"《金匮要略》", compose:"干地黄、山药、山茱萸、泽泻、茯苓、牡丹皮、桂枝、附子", effect:"补肾助阳", indic:"肾阳不足。腰痛脚软、身半以下常有冷感、小便不利或反多、痰饮、消渴", key:"温补肾阳代表方。", story:"仲景方。在六味地黄基础上加桂枝、附子，温补肾阳，微微生火，以生肾气，故名「肾气」。是肾阳虚的经典方。"},
      {name:"右归丸", source:"《景岳全书》", compose:"熟地、山药、山茱萸、枸杞、菟丝子、鹿角胶、杜仲、肉桂、当归、制附子", effect:"温补肾阳，填精止遗", indic:"肾阳不足、命门火衰。神疲气怯、畏寒肢冷、阳痿遗精、腰膝酸软", key:"纯补肾阳。", story:"张景岳创制。在肾气丸基础上去泻药，专事温补，加鹿角胶、菟丝子、杜仲等填精，是纯补肾阳的代表方。"},
      {name:"左归丸", source:"《景岳全书》", compose:"熟地、山药、枸杞、山茱萸、川牛膝、菟丝子、鹿角胶、龟板胶", effect:"滋阴补肾，填精益髓", indic:"真阴不足。腰酸膝软、头晕目眩、遗精滑泄、口燥舌干", key:"纯补肾阴。", story:"张景岳创制。与右归丸相对，专补真阴，去泻药，加鹿龟二胶血肉有情之品，填精益髓，是纯补肾阴的代表方。"},
      {name:"参苓白术散", source:"《太平惠民和剂局方》", compose:"人参、白术、茯苓、炙甘草、山药、白扁豆、莲子、薏苡仁、砂仁、桔梗", effect:"益气健脾，渗湿止泻", indic:"脾虚夹湿证。食少便溏、或泻或吐、四肢乏力、形体消瘦、胸脘闷胀", key:"脾虚夹湿代表方。", story:"在四君子基础上加山药、扁豆、莲子、薏仁健脾渗湿，砂仁醒脾，桔梗载药上行。使脾气得健、湿邪得去，是脾虚泄泻的常用方。"},
      {name:"补阳还五汤", source:"《医林改错》", compose:"黄芪、当归尾、赤芍、地龙、川芎、红花、桃仁", effect:"补气活血通络", indic:"中风后遗症。半身不遂、口眼喎斜、语言謇涩、口角流涎、下肢痿废、小便频数", key:"气虚血瘀代表方。", story:"王清任创制。重用黄芪大补元气，配少量活血药，使气旺则血行，瘀去络通。是中风后遗症、气虚血瘀的经典方。"},
      {name:"桃红四物汤", source:"《医宗金鉴》", compose:"熟地、当归、白芍、川芎、桃仁、红花", effect:"养血活血", indic:"血虚兼血瘀。月经不调、痛经、经色紫暗有块、或产后恶露不行", key:"养血活血基础方。", story:"四物汤加桃仁、红花，补血之中兼能活血，使血虚得补、血瘀得行，是妇科调经的常用基础方。"},
      {name:"失笑散", source:"《太平惠民和剂局方》", compose:"五灵脂、蒲黄", effect:"活血祛瘀，散结止痛", indic:"瘀血停滞。心腹剧痛、或产后恶露不行、月经不调、少腹急痛", key:"活血止痛简便方。", story:"五灵脂、蒲黄等分，醋调为散。药简力专，活血祛瘀止痛，服后病愈，不觉欣喜，故名「失笑」。"},
      {name:"生化汤", source:"《傅青主女科》", compose:"全当归、川芎、桃仁、炮姜、炙甘草", effect:"养血化瘀，温经止痛", indic:"产后血虚寒凝、瘀血内阻。产后恶露不行、小腹冷痛", key:"产后常用方。", story:"傅山创制。当归养血活血为君，川芎、桃仁活血，炮姜温经，甘草和中。使新血生、瘀血化，故名「生化」，是产后调理的经典方。"},
      {name:"完带汤", source:"《傅青主女科》", compose:"白术、山药、人参、白芍、车前子、苍术、甘草、陈皮、黑芥穗、柴胡", effect:"补中健脾，化湿止带", indic:"脾虚肝郁、湿浊下注。带下色白或淡黄、量多质稀、倦怠便溏", key:"脾虚带下代表方。", story:"傅山创制。重用白术、山药健脾，配柴胡、白芍疏肝，苍术、车前子化湿，使脾健湿去、带下自止。是脾虚带下的经典方。"},
      {name:"固冲汤", source:"《医学衷中参西录》", compose:"白术、生黄芪、龙骨、牡蛎、萸肉、白芍、海螵蛸、茜草、棕榈炭、五倍子", effect:"益气健脾，固冲摄血", indic:"脾气虚弱、冲脉不固。血崩或月经过多、色淡质稀、心悸气短、腰膝酸软", key:"崩漏代表方之一。", story:"张锡纯创制。黄芪、白术益气健脾，龙牡、萸肉、海螵蛸、棕炭、五倍子固涩止血，茜草化瘀，使气充血止、冲脉得固。"},
      {name:"胶艾汤", source:"《金匮要略》", compose:"川芎、阿胶、甘草、艾叶、当归、芍药、干地黄", effect:"养血止血，调经安胎", indic:"妇人冲任虚损。崩漏下血、月经过多、或妊娠下血、腹中疼痛", key:"养血安胎止血方。", story:"仲景方。阿胶、艾叶止血安胎，四物汤养血调经，甘草和中。使血虚得养、出血得止，是妇科崩漏、胎漏的经典方。"},
      {name:"当归补血汤", source:"《内外伤辨惑论》", compose:"黄芪、当归", effect:"补气生血", indic:"血虚阳浮证。肌热面赤、烦渴欲饮、脉洪大而虚、重按无力", key:"补气生血代表方。", story:"李东垣创制。黄芪五倍于当归，大补肺脾之气以生血。有形之血不能速生，无形之气所当急固，是血虚发热的经典方。"},
      {name:"炙甘草汤", source:"《伤寒论》", compose:"炙甘草、生姜、人参、生地黄、桂枝、阿胶、麦冬、麻仁、大枣", effect:"滋阴养血，益气温阳，复脉定悸", indic:"阴血不足、阳气虚弱证。脉结代、心动悸、虚羸少气、舌光少苔", key:"复脉定悸代表方。", story:"仲景治伤寒脉结代、心动悸之主方。炙甘草、人参、大枣益气，生地、麦冬、阿胶、麻仁滋阴养血，桂枝、生姜温通。气阴双补，使脉复悸定。"},
      {name:"百合固金汤", source:"《慎斋遗书》", compose:"百合、熟地、生地、当归、白芍、甘草、桔梗、玄参、贝母、麦冬", effect:"滋肾保肺，止咳化痰", indic:"肺肾阴虚、虚火上炎。咳嗽气喘、痰中带血、咽喉燥痛、手足心热、骨蒸盗汗", key:"肺肾阴虚咳嗽代表方。", story:"百合润肺止咳，生熟地滋肾阴，麦冬、玄参、贝母润肺化痰，当归、白芍养血，桔梗载药上行。使肺肾得养、虚火得清、咳嗽得止。"},
      {name:"麦门冬汤", source:"《金匮要略》", compose:"麦门冬、半夏、人参、甘草、粳米、大枣", effect:"清养肺胃，降逆下气", indic:"肺胃阴伤、虚火上炎。咳唾涎沫、短气喘促、咽喉干燥、舌红少苔、脉虚数", key:"肺胃阴虚代表方。", story:"仲景方。重用麦门冬清养肺胃之阴，少量半夏降逆化痰，人参、甘草、粳米、大枣益气和中。培土生金，使肺胃得养、虚火自降。"},
      {name:"清燥救肺汤", source:"《医门法律》", compose:"桑叶、石膏、甘草、人参、胡麻仁、阿胶、麦冬、杏仁、枇杷叶", effect:"清燥润肺", indic:"温燥伤肺。头痛身热、干咳无痰、气逆而喘、咽喉干燥、鼻燥、胸满胁痛", key:"温燥伤肺代表方。", story:"喻嘉言创制。桑叶、石膏清燥热，麦冬、阿胶、胡麻仁、人参养阴益气，杏仁、枇杷叶降肺气。使燥热得清、肺阴得润、气逆得降。"},
      {name:"桑菊饮", source:"《温病条辨》", compose:"桑叶、菊花、杏仁、连翘、薄荷、桔梗、甘草、苇根", effect:"疏风清热，宣肺止咳", indic:"风温初起。咳嗽、身热不甚、口微渴", key:"辛凉轻剂。", story:"吴鞠通创制。桑叶、菊花疏风清热，杏仁、桔梗宣肺止咳，连翘、薄荷助其透邪，苇根生津。是风温初起、咳嗽的轻清之剂。"},
      {name:"麻杏石甘汤", source:"《伤寒论》", compose:"麻黄、杏仁、甘草、石膏", effect:"辛凉疏表，清肺平喘", indic:"表邪未解、肺热咳喘。身热不解、咳逆气急、鼻煽、口渴、有汗或无汗", key:"肺热咳喘代表方。", story:"仲景方。麻黄宣肺平喘，石膏清泻肺热，杏仁降气，甘草和中。四药合用，使邪热得清、肺气得宣、喘咳得平。"},
      {name:"定喘汤", source:"《摄生众妙方》", compose:"白果、麻黄、苏子、甘草、款冬花、杏仁、桑白皮、黄芩、半夏", effect:"宣肺降气，清热化痰", indic:"风寒外束、痰热内蕴。哮喘咳嗽、痰多气急、痰稠色黄、或微恶风寒", key:"哮喘常用方。", story:"麻黄宣肺散寒，白果敛肺定喘，苏子、杏仁、半夏降气祛痰，桑皮、黄芩清肺热，款冬润肺。散中有收、宣中有降，是哮喘的常用方。"},
      {name:"苏子降气汤", source:"《太平惠民和剂局方》", compose:"紫苏子、半夏、川当归、炙甘草、前胡、厚朴、肉桂、生姜、大枣、苏叶", effect:"降气平喘，祛痰止咳", indic:"上实下虚之喘咳。痰涎壅盛、喘咳短气、胸膈满闷、腰痛脚弱、或肢体浮肿", key:"上实下虚喘咳方。", story:"苏子、半夏、前胡、厚朴降气化痰，肉桂温肾纳气，当归养血，生姜、苏叶散寒。标本兼顾，使气降痰消、喘咳得平。"},
      {name:"旋覆代赭汤", source:"《伤寒论》", compose:"旋覆花、人参、生姜、代赭石、炙甘草、半夏、大枣", effect:"降逆化痰，益气和胃", indic:"胃虚痰阻气逆。心下痞硬、噫气不除、反胃呕吐、吐涎沫", key:"胃虚气逆代表方。", story:"仲景方。旋覆花下气消痰，代赭石重镇降逆，半夏、生姜祛痰散痞，人参、甘草、大枣益气和中。使胃气得降、痰浊得消、噫气得除。"},
      {name:"橘皮竹茹汤", source:"《金匮要略》", compose:"橘皮、竹茹、大枣、生姜、甘草、人参", effect:"降逆止呃，益气清热", indic:"胃虚有热之呃逆。呃逆或干呕、虚烦少气、口干、舌红嫩", key:"胃虚呃逆代表方。", story:"仲景方。橘皮理气和胃，竹茹清热止呃，人参、甘草、大枣益气，生姜和胃。使胃气得降、虚热得清、呃逆得止。"},
      {name:"丁香柿蒂汤", source:"《症因脉治》", compose:"丁香、柿蒂、人参、生姜", effect:"温中益气，降逆止呃", indic:"胃气虚寒之呃逆。呃逆不已、胸痞脘闷、舌淡苔白、脉沉迟", key:"虚寒呃逆方。", story:"丁香温胃散寒，柿蒂降逆止呃，人参益气，生姜和胃。四药合用，使中焦得温、胃气得降、呃逆得止。"},
      {name:"小半夏汤", source:"《金匮要略》", compose:"半夏、生姜", effect:"化痰散饮，和胃降逆", indic:"痰饮呕吐。呕吐痰涎、不渴、心下痞硬", key:"痰饮呕吐基础方。", story:"仲景方。半夏化痰降逆，生姜温中止呕。药仅两味，却是治痰饮呕吐的基础方，后世许多止呕方从此化裁。"},
      {name:"大半夏汤", source:"《金匮要略》", compose:"半夏、人参、白蜜", effect:"和胃降逆，益气润燥", indic:"胃气虚弱、痰浊内阻。胃反呕吐、朝食暮吐、暮食朝吐、完谷不化", key:"胃反呕吐方。", story:"仲景方。半夏降逆止呕，人参益气补虚，白蜜润燥和中。使胃气得降、中气得补，是胃反的经典方。"},
      {name:"生姜泻心汤", source:"《伤寒论》", compose:"生姜、炙甘草、人参、干姜、黄芩、半夏、黄连、大枣", effect:"和胃消痞，散水消饮", indic:"水热互结痞证。心下痞硬、干呕食臭、胁下有水气、腹中雷鸣下利", key:"水热互结痞证方。", story:"仲景方。在半夏泻心汤基础上重用生姜，增强散水消痞之力。使水气得散、寒热得平、痞利得除。"},
      {name:"甘草泻心汤", source:"《伤寒论》", compose:"炙甘草、黄芩、人参、干姜、黄连、半夏、大枣", effect:"和胃补中，消痞止利", indic:"胃气虚弱、寒热错杂。心下痞硬而满、干呕心烦、下利不止", key:"胃虚痞利方。", story:"仲景方。重用炙甘草补中和胃，配辛开苦降之品。使中气得补、寒热得调、痞利得止，并治狐惑病。"},
      {name:"半夏泻心汤", source:"《伤寒论》", compose:"半夏、黄芩、干姜、人参、炙甘草、黄连、大枣", effect:"寒热平调，消痞散结", indic:"寒热互结之痞证。心下痞、满而不痛、呕吐下利", key:"寒热错杂痞证代表方。", story:"仲景方。半夏、干姜辛开，黄芩、黄连苦降，人参、甘草、大枣补中。辛开苦降、寒热并用，是和解中焦寒热的代表方。"},
      {name:"大黄黄连泻心汤", source:"《伤寒论》", compose:"大黄、黄连", effect:"泻热消痞", indic:"热痞。心下痞、按之濡、关脉浮", key:"热痞代表方。", story:"仲景方。大黄、黄连苦寒泻热，以麻沸汤渍服，取轻清之气泻心下之热，使热去痞消。"},
      {name:"附子泻心汤", source:"《伤寒论》", compose:"大黄、黄连、黄芩、附子", effect:"泻热消痞，扶阳固表", indic:"热痞兼表阳虚。心下痞、恶寒汗出", key:"热痞兼阳虚方。", story:"仲景方。三黄泻热消痞，附子扶阳固表。寒热并用，使热痞得消、表阳得固。"},
      {name:"黄连汤", source:"《伤寒论》", compose:"黄连、炙甘草、干姜、桂枝、人参、半夏、大枣", effect:"寒热并调，和胃降逆", indic:"上热下寒证。胸中有热、胃中有寒、腹中痛、欲呕吐", key:"上热下寒代表方。", story:"仲景方。黄连清上热，干姜、桂枝温下寒，半夏降逆，人参、甘草、大枣和中。使上下寒热得调、气机得畅。"},
      {name:"干姜黄芩黄连人参汤", source:"《伤寒论》", compose:"干姜、黄芩、黄连、人参", effect:"寒热并调，和中降逆", indic:"寒格证。吐下之后、寒格更甚、食入即吐", key:"寒格代表方。", story:"仲景方。干姜温中，黄芩、黄连清热，人参益气。寒热并用，使格拒得通、吐利得止。"},
      {name:"乌梅丸", source:"《伤寒论》", compose:"乌梅、细辛、干姜、黄连、当归、附子、蜀椒、桂枝、人参、黄柏", effect:"温脏安蛔，兼治寒热错杂", indic:"蛔厥、久利。腹痛时作、烦闷呕吐、得食则呕、常自吐蛔", key:"安蛔代表方，亦治久利。", story:"仲景方。乌梅安蛔，蜀椒、细辛、干姜、附子、桂枝温脏，黄连、黄柏清热，人参、当归补虚。寒热并用、气血兼顾，是安蛔及久利的经典方。"}
    ];
    // NOTE: The above is truncated in this call for length; the actual local file has the complete original 30 formulas + full plan81 tasks + quote module. Use the verified local file.
  })();

  // ===== 每日一句（北京时间自动轮换）=====
  (function(){
    var QUOTES = [
      {zh:"真正的自信，是承认自己不完美后，依然选择前行。", en:"True confidence is choosing to move forward after accepting your imperfections."},
      {zh:"独立不是拒绝帮助，而是即使没有帮助，也能站稳。", en:"Independence is not refusing help, but standing firm even without it."},
      {zh:"成长往往发生在舒适区之外，而不是在抱怨之中。", en:"Growth happens outside the comfort zone, not in complaints."},
      {zh:"金钱是工具，不是目的。学会驾驭它，而不是被它驾驭。", en:"Money is a tool, not a goal. Learn to master it, rather than be mastered by it."},
      {zh:"自由的代价是责任。逃避责任的人，永远得不到真正的自由。", en:"The price of freedom is responsibility. Those who avoid it never gain true freedom."},
      {zh:"勇气不是没有恐惧，而是带着恐惧依然行动。", en:"Courage is not the absence of fear, but acting despite it."},
      {zh:"行动是最好的答案。想得再多，不如迈出一步。", en:"Action is the best answer. Thinking more achieves less than taking one step."},
      {zh:"生活不会因为你的等待而变好，只会因为你的选择而改变。", en:"Life does not improve because you wait; it changes because of the choices you make."},
      {zh:"自我接纳不是放弃进步，而是停止与自己为敌。", en:"Self-acceptance is not giving up on growth, but stopping the war against yourself."},
      {zh:"真正的强大，是能在无人看见时依然坚持做正确的事。", en:"True strength is persisting in what is right even when no one is watching."},
      {zh:"不要用别人的尺子衡量自己的人生。", en:"Do not measure your life with someone else's ruler."},
      {zh:"每一次拒绝都是一次筛选，帮你留下真正重要的东西。", en:"Every rejection is a filter that helps keep what truly matters."},
      {zh:"自律不是束缚，而是通往自由的最短路径。", en:"Discipline is not confinement, but the shortest path to freedom."},
      {zh:"失败不可怕，可怕的是把失败当成终点。", en:"Failure is not frightening; treating it as the end is."},
      {zh:"把注意力放在可控的事情上，你会发现力量其实一直在。", en:"Focus on what you can control, and you will find the power was always there."},
      {zh:"成熟的标志之一，是不再急于向世界证明自己。", en:"One sign of maturity is no longer rushing to prove yourself to the world."},
      {zh:"财富的本质是选择的自由，而不是数字的堆积。", en:"The essence of wealth is the freedom to choose, not the accumulation of numbers."},
      {zh:"真正的休息，是内心的平静，而不是身体的躺平。", en:"True rest is inner calm, not physical idleness."},
      {zh:"你不需要完美才开始，你需要开始才会接近完美。", en:"You do not need to be perfect to start; you need to start to approach perfection."},
      {zh:"把每一次跌倒都当成校准方向的机会。", en:"Treat every fall as a chance to recalibrate your direction."},
      {zh:"独立思考比跟随多数人更需要勇气。", en:"Thinking independently requires more courage than following the majority."},
      {zh:"金钱会放大你的性格，不会改变你的本质。", en:"Money amplifies your character; it does not change your essence."},
      {zh:"真正的成长是安静的，它不需要观众。", en:"True growth is quiet; it needs no audience."},
      {zh:"接受不完美的自己，是对自己最大的慈悲。", en:"Accepting your imperfect self is the greatest kindness you can show yourself."},
      {zh:"行动创造机会，等待只会消耗时间。", en:"Action creates opportunity; waiting only consumes time."},
      {zh:"自由不是想做什么就做什么，而是能决定不做什么。", en:"Freedom is not doing whatever you want, but being able to decide what not to do."},
      {zh:"自信来自反复完成小而难的事。", en:"Confidence comes from repeatedly completing small but difficult things."},
      {zh:"生活没有标准答案，只有适合自己的选择。", en:"Life has no standard answers, only choices that suit you."},
      {zh:"把注意力从「我不够好」转向「我还能做什么」。", en:"Shift your focus from \"I am not good enough\" to \"What else can I do?\""},
      {zh:"真正的勇气，是在不确定中依然选择向前。", en:"True courage is choosing to move forward amid uncertainty."},
      {zh:"成长的代价是暂时的不适，停滞的代价是长期的遗憾。", en:"The cost of growth is temporary discomfort; the cost of stagnation is lasting regret."},
      {zh:"金钱买不到时间，但能买到更多选择时间的自由。", en:"Money cannot buy time, but it can buy the freedom to choose how to spend it."},
      {zh:"自我接纳不是终点，而是开始真正改变的起点。", en:"Self-acceptance is not the end, but the starting point of real change."},
      {zh:"不要把自己的价值寄托在别人的评价上。", en:"Do not place your worth in the evaluations of others."},
      {zh:"坚持做难而正确的事，时间会站在你这边。", en:"Keep doing what is hard yet right, and time will stand with you."}
    ];
    function getBeijingDayIndex() {
      var now = new Date();
      var fmt = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
      var parts = fmt.formatToParts(now);
      var y, m, d;
      parts.forEach(function(p) {
        if (p.type === 'year') y = parseInt(p.value, 10);
        if (p.type === 'month') m = parseInt(p.value, 10);
        if (p.type === 'day') d = parseInt(p.value, 10);
      });
      var utc = Date.UTC(y, m - 1, d);
      var base = Date.UTC(2020, 0, 1);
      var dayIndex = Math.floor((utc - base) / 86400000);
      return dayIndex;
    }
    var idx = getBeijingDayIndex() % QUOTES.length;
    if (idx < 0) idx += QUOTES.length;
    var q = QUOTES[idx];
    var zhEl = document.getElementById('quote-zh');
    var enEl = document.getElementById('quote-en');
    if (zhEl && enEl) {
      zhEl.textContent = q.zh;
      enEl.textContent = q.en;
    }
  })();
  </script>
