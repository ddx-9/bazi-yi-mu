<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>尊贵的杜杜熊 · 每日一方</title>
  <meta name="description" content="尊贵的杜杜熊 · 每日学习一首经典中医方剂 · 过年前81件小事" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood: #2d6a4f;
      --wood-light: #40916c;
      --earth: #bc6c25;
      --water: #1d3557;
      --fire: #e76f51;
      --gold: #c9a227;
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e8e6e3;
      --muted: #a0a8b0;
      --accent: #52b788;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Noto Serif SC', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse at 20% 20%, rgba(45,106,79,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(188,108,37,0.1) 0%, transparent 50%);
    }
    .container { max-width: 860px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    header {
      text-align: center;
      padding: 2.8rem 0 2rem;
      position: relative;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 60px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.3rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1.1rem;
      opacity: 0.9;
    }
    h1 {
      font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-size: clamp(2rem, 6vw, 2.9rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #95d5b2, #52b788, #2d6a4f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      letter-spacing: 0.05em;
    }
    .formula-card {
      background: linear-gradient(145deg, #1a2332, #152028);
      border: 1px solid rgba(82,183,136,0.25);
      border-radius: 20px;
      padding: 1.8rem 1.6rem;
      margin: 1.8rem 0 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .formula-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--wood-light), var(--accent), #95d5b2);
    }
    .formula-title {
      font-size: 1.55rem;
      font-weight: 600;
      color: #95d5b2;
      letter-spacing: 0.06em;
      margin-bottom: 0.25rem;
    }
    .formula-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    .formula-source {
      display: inline-block;
      background: rgba(82,183,136,0.12);
      color: var(--accent);
      font-size: 0.78rem;
      padding: 0.2rem 0.7rem;
      border-radius: 6px;
    }
    .formula-body {
      display: grid;
      gap: 0.9rem;
      margin-top: 1.3rem;
    }
    .formula-item {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 1rem 1.1rem;
    }
    .formula-item h4 {
      font-size: 0.88rem;
      color: var(--accent);
      margin-bottom: 0.4rem;
      letter-spacing: 0.05em;
    }
    .formula-item p {
      font-size: 0.95rem;
      color: #d1d5db;
      margin: 0;
      line-height: 1.65;
    }
    .formula-item.story {
      border-left: 3px solid var(--accent);
      background: rgba(82,183,136,0.07);
    }
    .formula-item.story h4 {
      color: #95d5b2;
    }
    .formula-nav {
      display: flex;
      gap: 0.6rem;
      margin-top: 1.3rem;
      flex-wrap: wrap;
    }
    .formula-nav button {
      background: rgba(82,183,136,0.15);
      border: 1px solid rgba(82,183,136,0.3);
      color: var(--accent);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .formula-nav button:hover {
      background: rgba(82,183,136,0.28);
    }
    .section {
      background: var(--card);
      border-radius: 18px;
      padding: 1.5rem 1.4rem;
      margin-bottom: 1.3rem;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .section h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section h2::before {
      content: '';
      width: 5px; height: 1em;
      background: var(--accent);
      border-radius: 3px;
    }
    .quote {
      border-left: 3px solid var(--accent);
      padding: 0.7rem 1.1rem;
      margin: 0.8rem 0;
      background: rgba(82,183,136,0.06);
      border-radius: 0 10px 10px 0;
      font-style: italic;
      color: #c5c9ce;
      font-size: 0.95rem;
    }
    footer {
      text-align: center;
      padding: 2.2rem 1rem 1rem;
      color: var(--muted);
      font-size: 0.82rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
    .plan81 {
      background: var(--card);
      border: 1px solid rgba(82,183,136,0.2);
      border-radius: 20px;
      padding: 1.6rem 1.5rem;
      margin: 1.5rem 0 1.5rem;
    }
    .plan81 h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .plan81 h2::before {
      content: '';
      width: 5px; height: 1em;
      background: var(--accent);
      border-radius: 3px;
    }
    .plan81-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.1rem;
    }
    .plan81-today {
      background: rgba(82,183,136,0.08);
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      padding: 1.1rem 1.2rem;
      margin-bottom: 1rem;
    }
    .plan81-date {
      font-size: 0.82rem;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .plan81-task {
      font-size: 1.08rem;
      color: var(--text);
      margin-bottom: 0.9rem;
      line-height: 1.5;
    }
    .plan81-btn {
      border: 0;
      border-radius: 999px;
      padding: 0.5rem 1.3rem;
      background: var(--accent);
      color: #0f1419;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .plan81-btn:hover { opacity: 0.9; }
    .plan81-btn.on {
      background: rgba(82,183,136,0.35);
      color: var(--accent);
    }
    .plan81-bar {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      margin: 1rem 0 0.6rem;
      overflow: hidden;
    }
    .plan81-bar i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--wood-light), var(--accent));
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .plan81-all { margin-top: 0.8rem; }
    .plan81-all summary {
      cursor: pointer;
      color: var(--accent);
      font-size: 0.9rem;
      list-style: none;
    }
    .plan81-all summary::-webkit-details-marker { display: none; }
    .plan81-all ol {
      padding-left: 1.6em;
      margin-top: 0.8rem;
      font-size: 0.9rem;
      color: #c5c9ce;
    }
    .plan81-all li {
      margin-bottom: 0.45rem;
      padding-left: 0.3rem;
    }
    .plan81-all li.done {
      opacity: 0.45;
      text-decoration: line-through;
    }
    .plan81-all li.now {
      font-weight: 600;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">每日一方 · 中医学习</div>
      <h1>尊贵的杜杜熊</h1>
      <p class="subtitle">每天学一首经典中医方剂</p>
    </header>

    <section class="formula-card" id="daily-formula">
      <div class="formula-title" id="f-name">加载中…</div>
      <div class="formula-meta" id="f-date"></div>
      <div class="formula-source" id="f-source"></div>
      <div class="formula-body">
        <div class="formula-item story">
          <h4>方名由来 / 小故事</h4>
          <p id="f-story"></p>
        </div>
        <div class="formula-item">
          <h4>组成</h4>
          <p id="f-compose"></p>
        </div>
        <div class="formula-item">
          <h4>功效</h4>
          <p id="f-effect"></p>
        </div>
        <div class="formula-item">
          <h4>主治</h4>
          <p id="f-indic"></p>
        </div>
        <div class="formula-item">
          <h4>要点速记</h4>
          <p id="f-key"></p>
        </div>
      </div>
      <div class="formula-nav">
        <button type="button" id="f-prev">← 前一天</button>
        <button type="button" id="f-today">今天</button>
        <button type="button" id="f-next">后一天 →</button>
      </div>
    </section>

    <section class="plan81" id="plan81">
      <h2>过年前小事计划</h2>
      <p class="plan81-sub" id="p81-sub"></p>
      <div class="plan81-today">
        <div class="plan81-date" id="p81-date"></div>
        <div class="plan81-task" id="p81-task"></div>
        <button class="plan81-btn" id="p81-done" type="button">今天做了</button>
      </div>
      <div class="plan81-bar"><i id="p81-fill"></i></div>
      <details class="plan81-all">
        <summary>查看全部 81 天 ▾</summary>
        <ol id="p81-list"></ol>
      </details>
    </section>

    <section class="section">
      <h2>给自己的一句话</h2>
      <div class="quote" id="daily-quote">
        <div id="quote-zh" style="margin-bottom:0.45rem;font-style:normal;color:var(--text);"></div>
        <div id="quote-en" style="font-size:0.88rem;opacity:0.85;font-style:italic;"></div>
      </div>
    </section>

    <footer>
      <p>尊贵的杜杜熊 · 每日一方</p>
      <p style="margin-top:0.4rem;">仅供学习参考 · 请勿自行用药</p>
      <p style="margin-top:1rem;"><a href="https://github.com/ddx-9/bazi-yi-mu" target="_blank">GitHub 仓库</a></p>
    </footer>
  </div>

</body>
