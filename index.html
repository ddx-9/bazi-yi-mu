  <script>
  (function(){
    var FORMULAS = [
      {name:"桂枝汤", source:"《伤寒论》", compose:"桂枝9g、芍药9g、生姜9g、大枣12枚、炙甘草6g", effect:"解肌发表，调和营卫", indic:"外感风寒表虚证。恶风发热、汗出、头痛、鼻鸣干呕、苔薄白、脉浮缓", key:"调和营卫第一方。有汗用桂枝，无汗用麻黄。", story:"张仲景《伤寒论》开篇第一方。桂枝辛温解肌，芍药酸寒敛营，一散一收，调和营卫。被誉为「群方之冠」，后世无数方从此化裁而来。"},
      {name:"麻黄汤", source:"《伤寒论》", compose:"麻黄9g、桂枝6g、杏仁9g、炙甘草3g", effect:"发汗解表，宣肺平喘", indic:"外感风寒表实证。恶寒发热、无汗、头身疼痛、喘、脉浮紧", key:"发汗解表第一方。无汗而喘用麻黄汤。", story:"仲景治伤寒表实无汗之主方。麻黄开腠发汗，桂枝助其解表，杏仁降肺气，甘草调和。与桂枝汤并称「麻桂」，一开一合，表证总纲。"},
      {name:"小柴胡汤", source:"《伤寒论》", compose:"柴胡24g、黄芩9g、人参9g、半夏9g、生姜9g、大枣12枚、炙甘草9g", effect:"和解少阳", indic:"少阳证。往来寒热、胸胁苦满、默默不欲饮食、心烦喜呕、口苦咽干目眩", key:"和解少阳代表方。", story:"少阳病主方。柴胡疏少阳之郁，黄芩清少阳之热，人参、大枣、甘草扶正，半夏、生姜和胃。后世「和解法」由此确立，被誉为「少阳枢机」之方。"},
      {name:"四君子汤", source:"《太平惠民和剂局方》", compose:"人参、白术、茯苓、炙甘草各等分", effect:"益气健脾", indic:"脾胃气虚证。面色萎白、语声低微、气短乏力、食少便溏、脉虚弱", key:"补气基础方。四君子 → 六君子 → 香砂六君子。", story:"人参、白术、茯苓、甘草四药，药性平和中正，如君子之德，故名「四君子」。后世补气方多从此加减，是脾胃气虚的基础方。"},
      {name:"四物汤", source:"《太平惠民和剂局方》", compose:"熟地黄、当归、白芍、川芎各等分", effect:"补血调血", indic:"营血虚滞证。头晕目眩、心悸失眠、面色无华、月经不调、痛经", key:"补血基础方。", story:"熟地补血、当归活血、白芍敛血、川芎行血，四药相合，补中有动，被誉为「血家百病此方通」。妇科调经多从此化裁。"},
      {name:"六味地黄丸", source:"《小儿药证直诀》", compose:"熟地黄24g、山萸肉12g、山药12g、泽泻9g、牡丹皮9g、茯苓9g", effect:"滋阴补肾", indic:"肾阴虚证。腰膝酸软、头晕耳鸣、盗汗、遗精、骨蒸潮热、舌红少苔", key:"三补三泻。补肾阴基础方。", story:"钱乙从《金匮》肾气丸化裁而来，去桂附，专补肾阴。熟地、山萸、山药为三补，泽泻、丹皮、茯苓为三泻，补中有泻，滋而不腻，成为后世补阴第一方。"},
      {name:"逍遥散", source:"《太平惠民和剂局方》", compose:"柴胡、当归、白芍、白术、茯苓、炙甘草、生姜、薄荷", effect:"疏肝解郁，养血健脾", indic:"肝郁血虚脾弱证。两胁作痛、神疲食少、月经不调、乳房胀痛", key:"疏肝代表方。", story:"「逍遥」取自《庄子》，意指心无挂碍、自由自在。肝郁则气滞，气滞则血虚脾弱，此方疏肝养血健脾，使肝气得舒、气血得畅，身心得以逍遥。"},
      {name:"补中益气汤", source:"《脾胃论》", compose:"黄芪、炙甘草、人参、当归、陈皮、升麻、柴胡、白术", effect:"补中益气，升阳举陷", indic:"脾胃气虚、气虚下陷证。少气懒言、体倦乏力、脱肛、子宫脱垂、久泻", key:"李东垣补中升阳代表方。", story:"李东垣创制。他认为「脾胃内伤，百病由生」，用黄芪大补中气，升麻、柴胡升举清阳，使下陷之气得升。后世治气虚下陷、内脏下垂多从此方。"},
      {name:"归脾汤", source:"《济生方》", compose:"白术、茯神、黄芪、龙眼肉、酸枣仁、人参、木香、炙甘草、当归、远志", effect:"益气补血，健脾养心", indic:"心脾两虚证。心悸怔忡、健忘失眠、体倦食少、面色萎黄、崩漏", key:"心脾同治。", story:"「归脾」意指使心血归于脾、脾气归于心，心脾两脏同补。思虑过度伤及心脾，此方益气生血、健脾养心，是心脾两虚失眠、健忘的经典方。"},
      {name:"生脉散", source:"《医学启源》", compose:"人参、麦冬、五味子", effect:"益气生津，敛阴止汗", indic:"气阴两伤证。体倦气短、咽干口渴、汗多、脉虚细", key:"气阴双补。", story:"人参大补元气，麦冬养阴生津，五味子酸敛止汗。三药合用，气阴双补，能使将绝之脉复生，故名「生脉」。暑热伤气阴或久咳肺虚时常用。"},
      {name:"银翘散", source:"《温病条辨》", compose:"金银花、连翘、桔梗、薄荷、竹叶、生甘草、荆芥穗、淡豆豉、牛蒡子", effect:"辛凉透表，清热解毒", indic:"温病初起。发热、微恶风寒、无汗或有汗不畅、头痛口渴、咳嗽咽痛", key:"辛凉解表代表方。", story:"吴鞠通创制。金银花、连翘清热解毒为君，配辛凉透表之品，专治温病初起。与桑菊饮并称温病解表两大主方，一偏解毒，一偏宣肺。"},
      {name:"白虎汤", source:"《伤寒论》", compose:"石膏、知母、甘草、粳米", effect:"清热生津", indic:"气分热盛证。壮热面赤、烦渴引饮、汗出恶热、脉洪大有力", key:"清热生津代表方。", story:"白虎为西方金神，主清肃。本方清热力量峻猛，如白虎之威，故名。石膏清热泻火，知母滋阴润燥，粳米、甘草护胃，是气分大热的经典方。"},
      {name:"龙胆泻肝汤", source:"《医方集解》", compose:"龙胆草、黄芩、栀子、泽泻、木通、车前子、当归、生地、柴胡、甘草", effect:"清泻肝胆实火，清利肝经湿热", indic:"肝胆实火或湿热。头痛目赤、胁痛口苦、耳聋耳肿、阴肿阴痒、带下黄臭", key:"肝经湿热/实火代表方。", story:"龙胆草大苦大寒，专泻肝胆实火，故以「龙胆」名方。配伍清利湿热、养血柔肝之品，使泻火而不伤阴，是肝经实火湿热的代表方。"},
      {name:"大承气汤", source:"《伤寒论》", compose:"大黄、厚朴、枳实、芒硝", effect:"峻下热结", indic:"阳明腑实证。痞、满、燥、实。潮热谵语、手足濈然汗出、腹痛拒按、脉沉实", key:"苦寒峻下。", story:"「承气」意为承顺胃气下行。大黄攻下，芒硝软坚，枳实、厚朴行气除满，四药合用，峻下热结，使燥屎得下、胃气得承。是攻下法的代表方。"},
      {name:"理中丸", source:"《伤寒论》", compose:"人参、干姜、白术、炙甘草", effect:"温中祛寒，补气健脾", indic:"脾胃虚寒证。脘腹疼痛、喜温喜按、呕吐便溏、畏寒肢冷、口不渴", key:"温中补虚基础方。", story:"「理中」即调理中焦脾胃。干姜温中祛寒，人参、白术、甘草补气健脾，使中焦阳气得复、运化得健。是脾胃虚寒的基础方，可丸可汤。"},
      {name:"四逆汤", source:"《伤寒论》", compose:"附子、干姜、炙甘草", effect:"回阳救逆", indic:"少阴病。四肢厥逆、恶寒蜷卧、神衰欲寐、面色苍白、脉微细", key:"回阳救逆第一方。", story:"「四逆」指四肢厥逆。附子大辛大热回阳，干姜温中助阳，甘草缓和药性。三药合用，能救将绝之阳，是回阳救逆的第一方，危急时救急要药。"},
      {name:"真武汤", source:"《伤寒论》", compose:"茯苓、芍药、白术、生姜、附子", effect:"温阳利水", indic:"阳虚水泛证。畏寒肢厥、小便不利、心下悸、头眩、身瞤动、浮肿", key:"温阳利水代表方。", story:"真武即玄武，北方水神。本方温阳利水，如真武坐镇北方、统御水气，故名。附子温肾阳，茯苓、白术利水健脾，是阳虚水泛的经典方。"},
      {name:"五苓散", source:"《伤寒论》", compose:"猪苓、泽泻、白术、茯苓、桂枝", effect:"利水渗湿，温阳化气", indic:"蓄水证或水湿内停。小便不利、头痛微热、烦渴欲饮、水入即吐、或水肿", key:"利水化气代表方。", story:"五药合用，利水渗湿，桂枝通阳化气，使膀胱气化得行、水湿得去。仲景治蓄水证主方，后世利水方多从此加减。"},
      {name:"二陈汤", source:"《太平惠民和剂局方》", compose:"半夏、橘红、白茯苓、炙甘草", effect:"燥湿化痰，理气和中", indic:"湿痰证。咳嗽痰多、色白易咯、胸膈痞闷、恶心呕吐、肢体困倦", key:"治痰基础方。", story:"半夏、陈皮以陈久者良，故名「二陈」。半夏燥湿化痰，陈皮理气，茯苓健脾渗湿，甘草和中。一切痰饮皆可从此加减，被誉为「治痰总剂」。"},
      {name:"温胆汤", source:"《三因极一病证方论》", compose:"半夏、竹茹、枳实、陈皮、炙甘草、茯苓、生姜、大枣", effect:"理气化痰，清胆和胃", indic:"胆郁痰扰证。胆怯易惊、虚烦不宁、失眠多梦、呕吐呃逆、癫痫", key:"化痰和胃安神。", story:"「温胆」并非温热胆腑，而是使胆气恢复温和条达。胆为清净之腑，痰热扰之则不宁，此方化痰清热、和胃安神，使胆气复其常温。"},
      {name:"半夏厚朴汤", source:"《金匮要略》", compose:"半夏、厚朴、茯苓、生姜、苏叶", effect:"行气散结，降逆化痰", indic:"梅核气。咽中如有物阻、咯吐不出、吞咽不下、胸膈满闷", key:"梅核气专方。", story:"专为「梅核气」而设——咽中如有梅核梗阻，吐之不出、咽之不下。半夏、厚朴降气化痰，苏叶芳香行气，茯苓渗湿，是气滞痰凝的经典方。"},
      {name:"血府逐瘀汤", source:"《医林改错》", compose:"桃仁、红花、当归、生地、川芎、赤芍、牛膝、桔梗、柴胡、枳壳、甘草", effect:"活血化瘀，行气止痛", indic:"胸中血瘀证。胸痛、头痛日久、痛如针刺、或呃逆日久、失眠多梦", key:"活血化瘀代表方。", story:"王清任创制。他认为胸中为「血府」，血瘀于此则诸症蜂起。本方以桃红四物活血，四逆散行气，桔梗、牛膝一升一降，使气血上下通畅，是活血化瘀的代表方。"},
      {name:"补阳还五汤", source:"《医林改错》", compose:"黄芪120g、当归尾、赤芍、地龙、川芎、红花、桃仁", effect:"补气，活血，通络", indic:"中风后遗症。半身不遂、口眼歪斜、语言謇涩、口角流涎、下肢痿废", key:"大补元气以活血。", story:"王清任认为人的阳气有十分，中风后遗症因气虚血瘀，只剩五分。本方重用黄芪大补元气，配少量活血药，使气旺则血行，瘀去络通，故名「补阳还五」——补回失去的五分阳气。"},
      {name:"金匮肾气丸", source:"《金匮要略》", compose:"干地黄、山药、山茱萸、泽泻、茯苓、牡丹皮、桂枝、附子", effect:"补肾助阳", indic:"肾阳不足证。腰痛脚软、下半身常有冷感、少腹拘急、小便不利或反多", key:"阴中求阳。六味加桂附。", story:"出自《金匮要略》，故名「金匮」。在六味地黄基础上加桂枝、附子，取「阴中求阳」之意——善补阳者，必于阴中求阳，使阳得阴助而生化无穷。"},
      {name:"天王补心丹", source:"《摄生秘剖》", compose:"生地、人参、丹参、元参、白茯苓、五味子、远志、桔梗、当归、天冬、麦冬、柏子仁、酸枣仁", effect:"滋阴养血，补心安神", indic:"阴虚血少、神志不安。心悸失眠、虚烦神疲、梦遗健忘、大便干燥、口舌生疮", key:"滋阴安神代表方。", story:"传说为天王所传，故名「天王补心」。专治心阴不足、虚火上炎所致失眠心悸。生地、玄参、天麦冬滋阴，酸枣仁、柏子仁、远志安神，使心神得养。"},
      {name:"酸枣仁汤", source:"《金匮要略》", compose:"酸枣仁、甘草、知母、茯苓、川芎", effect:"养血安神，清热除烦", indic:"肝血不足、虚热内扰。虚烦失眠、心悸盗汗、头目眩晕、咽干口燥", key:"养血安神。", story:"酸枣仁味酸入肝，养肝血、安心神为主药。配知母清虚热，川芎调血，茯苓宁心，是肝血不足、虚烦失眠的经典小方，药简力专。"},
      {name:"玉屏风散", source:"《究原方》", compose:"黄芪、白术、防风", effect:"益气固表止汗", indic:"表虚自汗。汗出恶风、面色㿠白、舌淡苔薄白、脉浮虚；易感风邪", key:"益气固表。", story:"「玉屏风」比喻此方固护肌表，如玉石做成的屏风，挡住外风。黄芪益气固表，白术健脾，防风祛风，三药合用，固表而不留邪，是表虚易感的经典方。"},
      {name:"独活寄生汤", source:"《备急千金要方》", compose:"独活、桑寄生、杜仲、牛膝、细辛、秦艽、茯苓、肉桂心、防风、川芎、人参、甘草、当归、芍药、干地黄", effect:"祛风湿，止痹痛，益肝肾，补气血", indic:"痹证日久、肝肾两虚、气血不足。腰膝疼痛、肢节屈伸不利、或麻木不仁", key:"扶正祛邪。久痹肝肾不足。", story:"孙思邈《千金方》名方。独活祛下焦风湿，桑寄生补肝肾、强筋骨，配伍补气血之品，使祛邪不伤正、扶正不留邪，是久痹兼虚的代表方。"},
      {name:"仙方活命饮", source:"《校注妇人良方》", compose:"白芷、贝母、防风、赤芍、当归尾、甘草、皂角刺、穿山甲、天花粉、乳香、没药、金银花、陈皮", effect:"清热解毒，消肿溃坚，活血止痛", indic:"阳证痈疡肿毒初起。红肿热痛、或身热凛寒、苔薄白或黄、脉数有力", key:"疮疡肿毒第一方。", story:"「仙方」言其效如神仙所传，「活命」言其能救人性命。专治阳证疮疡初起，清热解毒、活血消肿，使毒散肿消，被誉为「疮疡之圣药、外科之首方」。"},
      {name:"百合固金汤", source:"《慎斋遗书》", compose:"百合、熟地、生地、当归、白芍、甘草、桔梗、玄参、贝母、麦冬", effect:"养阴润肺，化痰止咳", indic:"肺肾阴虚。咳嗽气喘、痰中带血、咽喉燥痛、手足心热、骨蒸盗汗", key:"养阴润肺。", story:"百合入肺，养阴润燥、清心安神，为君药；生熟地滋肾阴，金水相生，故名「固金」——固护肺金。肺肾阴虚、虚火灼金之咳嗽咯血，此方主之。"}
    ];

    var offset = 0;

    function dayOfYear(d) {
      var start = new Date(d.getFullYear(), 0, 0);
      var diff = d - start;
      return Math.floor(diff / 864e5);
    }

    function getDateByOffset(off) {
      var d = new Date();
      d.setHours(0,0,0,0);
      d.setDate(d.getDate() + off);
      return d;
    }

    function renderFormula() {
      var d = getDateByOffset(offset);
      var idx = dayOfYear(d) % FORMULAS.length;
      var f = FORMULAS[idx];
      var dateStr = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
      if (offset === 0) dateStr += ' · 今日一方';
      else if (offset < 0) dateStr += ' · 前' + (-offset) + '天';
      else dateStr += ' · 后' + offset + '天';

      document.getElementById('f-name').textContent = f.name;
      document.getElementById('f-date').textContent = dateStr;
      document.getElementById('f-source').textContent = f.source;
      document.getElementById('f-story').textContent = f.story;
      document.getElementById('f-compose').textContent = f.compose;
      document.getElementById('f-effect').textContent = f.effect;
      document.getElementById('f-indic').textContent = f.indic;
      document.getElementById('f-key').textContent = f.key;
    }

    document.getElementById('f-prev').onclick = function(){ offset--; renderFormula(); };
    document.getElementById('f-today').onclick = function(){ offset = 0; renderFormula(); };
    document.getElementById('f-next').onclick = function(){ offset++; renderFormula(); };

    renderFormula();
  })();
  </script>
</body>
</html>
